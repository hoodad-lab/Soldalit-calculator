<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEIM Soldalit Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles to handle active button states */
        .btn-option {
            transition: all 0.2s;
        }
        .btn-option.active {
            background-color: #ecfdf5; /* emerald-50 */
            border-color: #10b981; /* emerald-500 */
            color: #047857; /* emerald-700 */
            box-shadow: 0 0 0 1px #10b981;
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 py-8 px-4 font-sans text-slate-800">

<div class="max-w-5xl mx-auto space-y-8">
    
    <!-- Header -->
    <div class="text-center space-y-2 mb-10">
        <h1 class="text-3xl sm:text-4xl font-bold text-slate-900 tracking-tight">KEIM Soldalit Calculator</h1>
        <p class="text-slate-600 text-lg">The 25-Year Warranty Mineral Coating System for Australia</p>
    </div>

    <!-- MAIN TWO-COLUMN LAYOUT -->
    <div class="grid lg:grid-cols-12 gap-8 items-start">
        
        <!-- INPUT SECTION (Left Column, 7/12 width on large screens) -->
        <div class="lg:col-span-7 bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200 space-y-7">
            <div class="flex items-center space-x-2 border-b border-slate-100 pb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-600"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16.01" y1="10" y2="10"/><line x1="12" x2="12.01" y1="10" y2="10"/><line x1="8" x2="8.01" y1="10" y2="10"/><line x1="16" x2="16.01" y1="14" y2="14"/><line x1="12" x2="12.01" y1="14" y2="14"/><line x1="8" x2="8.01" y1="14" y2="14"/><line x1="16" x2="16.01" y1="18" y2="18"/><line x1="12" x2="12.01" y1="18" y2="18"/><line x1="8" x2="8.01" y1="18" y2="18"/></svg>
                <h2 class="text-2xl font-semibold text-slate-800">Project Details</h2>
            </div>

            <!-- Dimensions -->
            <div class="space-y-4">
                <label class="block text-sm font-medium text-slate-700">Surface Dimensions</label>
                <div id="walls-container" class="space-y-3">
                    <!-- Walls injected here by JS -->
                </div>
                <button type="button" id="add-wall-btn" class="flex items-center space-x-1 text-sm text-emerald-600 font-medium hover:text-emerald-700 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    <span>Add another wall</span>
                </button>
            </div>

            <!-- Exclusions -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Subtract Windows/Doors Area (m²)</label>
                <input type="number" id="exclusions" min="0" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-emerald-500 focus:outline-none focus:border-emerald-500 transition-colors" placeholder="Total area to exclude">
            </div>

            <!-- Colour -->
            <div>
                <label for="colour-search" class="block text-sm font-medium text-slate-700 mb-2">Colour</label>
                <div class="relative" id="colour-picker">
                    <div class="flex items-center gap-3 w-full px-4 py-3 border border-slate-300 rounded-lg bg-white focus-within:border-emerald-500 focus-within:ring-1 focus-within:ring-emerald-500 transition-colors">
                        <span id="colour-swatch" class="shrink-0 w-6 h-6 rounded-md border border-slate-300" style="background:#FFFFFF"></span>
                        <input type="text" id="colour-search" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="colour-list" class="flex-1 min-w-0 bg-transparent focus:outline-none text-slate-800 placeholder:text-slate-400" placeholder="Type a KEIM colour, e.g. 9049 or Avantgarde 101">
                        <button type="button" id="colour-clear" class="hidden shrink-0 text-slate-400 hover:text-slate-600 text-xl leading-none" aria-label="Clear colour">&times;</button>
                    </div>
                    <ul id="colour-list" role="listbox" class="hidden absolute z-30 left-0 right-0 mt-1 max-h-72 overflow-y-auto bg-white border border-slate-200 rounded-lg shadow-lg py-1"></ul>
                </div>
                <p id="colour-status" class="mt-2 text-xs text-slate-500">Pick your colour and the price group is set for you.</p>
                <div class="mt-3">
                    <span class="block text-xs font-medium text-slate-500 mb-1.5">Price group</span>
                    <div class="grid grid-cols-4 gap-2">
                        <button type="button" class="btn-option px-1 py-2.5 rounded-lg border text-xs sm:text-sm font-medium whitespace-nowrap bg-white border-slate-200 text-slate-600 hover:border-slate-300 text-center active" data-group="colourGroup" data-value="white">White</button>
                        <button type="button" class="btn-option px-1 py-2.5 rounded-lg border text-xs sm:text-sm font-medium whitespace-nowrap bg-white border-slate-200 text-slate-600 hover:border-slate-300 text-center" data-group="colourGroup" data-value="pg1">Group 1</button>
                        <button type="button" class="btn-option px-1 py-2.5 rounded-lg border text-xs sm:text-sm font-medium whitespace-nowrap bg-white border-slate-200 text-slate-600 hover:border-slate-300 text-center" data-group="colourGroup" data-value="pg2">Group 2</button>
                        <button type="button" class="btn-option px-1 py-2.5 rounded-lg border text-xs sm:text-sm font-medium whitespace-nowrap bg-white border-slate-200 text-slate-600 hover:border-slate-300 text-center" data-group="colourGroup" data-value="pg3">Group 3</button>
                    </div>
                </div>
            </div>

            <!-- Substrate Type -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Substrate Type</label>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" class="btn-option active px-4 py-3 rounded-lg border text-sm font-medium bg-white border-slate-200 text-slate-600 hover:border-slate-300 text-left" data-group="substrateType" data-value="bare">Bare / Unpainted</button>
                    <button type="button" class="btn-option px-4 py-3 rounded-lg border text-sm font-medium bg-white border-slate-200 text-slate-600 hover:border-slate-300 text-left" data-group="substrateType" data-value="painted">Previously Painted</button>
                </div>
            </div>

            <!-- Substrate Texture -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Substrate Texture</label>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" class="btn-option active px-4 py-3 rounded-lg border text-sm font-medium bg-white border-slate-200 text-slate-600 hover:border-slate-300 text-left" data-group="texture" data-value="standard">Standard</button>
                    <button type="button" class="btn-option px-4 py-3 rounded-lg border text-sm font-medium bg-white border-slate-200 text-slate-600 hover:border-slate-300 text-left" data-group="texture" data-value="textured">Textured</button>
                </div>
            </div>

            <!-- Substrate Condition -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Substrate Condition (Primer Requirement)</label>
                <div class="space-y-3">
                    <button type="button" class="btn-option active w-full text-left px-5 py-4 rounded-lg border text-sm bg-white border-slate-200 text-slate-600 hover:border-slate-300" data-group="condition" data-value="normal">
                        <span class="font-semibold block text-base">Normal Absorption</span>
                        <span class="text-xs opacity-80 mt-1 block">Water runs in long, thin tracks.</span>
                    </button>
                    <button type="button" class="btn-option w-full text-left px-5 py-4 rounded-lg border text-sm bg-white border-slate-200 text-slate-600 hover:border-slate-300" data-group="condition" data-value="absorbent">
                        <span class="font-semibold block text-base">Highly Absorbent</span>
                        <span class="text-xs opacity-80 mt-1 block">Water soaks quickly (short, thick runners).</span>
                    </button>
                    <button type="button" class="btn-option w-full text-left px-5 py-4 rounded-lg border text-sm bg-white border-slate-200 text-slate-600 hover:border-slate-300" data-group="condition" data-value="dusting">
                        <span class="font-semibold block text-base">Dusting or Limewashed</span>
                        <span class="text-xs opacity-80 mt-1 block">Leaves a chalky residue on the hand.</span>
                    </button>
                </div>
            </div>

            <!-- Crack Filling & Base Coat -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Crack Filling & Base Coat Selection</label>
                <div class="space-y-3">
                    <button type="button" class="btn-option active w-full text-left px-5 py-4 rounded-lg border text-sm bg-white border-slate-200 text-slate-600 hover:border-slate-300" data-group="baseCoat" data-value="soldalit">
                        <span class="font-semibold block text-base">Standard Finish (No Cracks)</span>
                        <span class="text-xs opacity-80 mt-1 block">KEIM Soldalit</span>
                    </button>
                    <button type="button" class="btn-option w-full text-left px-5 py-4 rounded-lg border text-sm bg-white border-slate-200 text-slate-600 hover:border-slate-300" data-group="baseCoat" data-value="grob">
                        <span class="font-semibold block text-base">Hairline Cracks (up to 0.5mm)</span>
                        <span class="text-xs opacity-80 mt-1 block">KEIM Soldalit-Grob (Slight texture)</span>
                    </button>
                    <button type="button" class="btn-option w-full text-left px-5 py-4 rounded-lg border text-sm bg-white border-slate-200 text-slate-600 hover:border-slate-300" data-group="baseCoat" data-value="contact-plus">
                        <span class="font-semibold block text-base">Static Cracks (0.5mm - 1mm)</span>
                        <span class="text-xs opacity-80 mt-1 block">KEIM Contact-Plus (Heavy texture)</span>
                    </button>
                    <button type="button" class="btn-option w-full text-left px-5 py-4 rounded-lg border text-sm bg-white border-slate-200 text-slate-600 hover:border-slate-300" data-group="baseCoat" data-value="contact-plus-grob">
                        <span class="font-semibold block text-base">Severe Cracks / Maximum Texture</span>
                        <span class="text-xs opacity-80 mt-1 block">KEIM Contact-Plus-Grob</span>
                    </button>
                </div>
            </div>

            <!-- Labour Assumptions -->
            <div class="pt-5 border-t border-slate-100">
                <label class="block text-sm font-medium text-slate-700 mb-3">Labour Assumptions (For Comparison)</label>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-slate-500 mb-1.5">Daily Rate ($)</label>
                        <div class="relative">
                            <span class="absolute left-3 top-3 text-slate-400">$</span>
                            <input type="number" id="labour-rate" min="0" value="400" class="w-full pl-7 pr-3 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 transition-colors">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-500 mb-1.5">Productivity / Coat</label>
                        <div class="relative">
                            <input type="number" id="productivity" min="1" value="150" class="w-full pr-8 pl-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 transition-colors">
                            <span class="absolute right-3 top-3 text-slate-400">m²</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- RESULTS SECTION (Right Column, 5/12 width) -->
        <div class="lg:col-span-5 sticky top-8">
            <!-- Empty State -->
            <div id="results-empty" class="h-full min-h-[500px] bg-slate-100 rounded-2xl border-2 border-slate-200 border-dashed flex flex-col items-center justify-center p-8 text-center text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mb-5 text-slate-300"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16.01" y1="10" y2="10"/><line x1="12" x2="12.01" y1="10" y2="10"/><line x1="8" x2="8.01" y1="10" y2="10"/><line x1="16" x2="16.01" y1="14" y2="14"/><line x1="12" x2="12.01" y1="14" y2="14"/><line x1="8" x2="8.01" y1="14" y2="14"/><line x1="16" x2="16.01" y1="18" y2="18"/><line x1="12" x2="12.01" y1="18" y2="18"/><line x1="8" x2="8.01" y1="18" y2="18"/></svg>
                <p class="text-base">Enter your project details to calculate the required material ratios and amounts.</p>
            </div>

            <!-- Populated Results -->
            <div id="results-populated" class="hidden bg-slate-900 rounded-2xl shadow-xl p-6 sm:p-8 text-slate-100 flex flex-col space-y-6">
                <!-- Content injected via JS -->
            </div>
        </div>

    </div> <!-- END TWO COLUMN GRID -->

    <!-- FULL WIDTH COMPARISON SECTION (Breaks out of the 2-column grid so it's not squished) -->
    <div id="comparison-container" class="hidden pt-12 pb-8 border-t border-slate-200">
        <!-- Content injected via JS -->
    </div>

</div>

    // Beautiful dynamic bucket renderer UI
    const renderBucketUI = (kg, productName) => {
        if (kg <= 0) return '';
        let b18 = Math.floor(kg / 18);
        let rem = kg % 18;
        let b5 = Math.floor(rem / 5);
        rem = rem % 5;
        let b2_5 = Math.ceil(rem / 2.5);

        // Smart rounding - avoids recommending silly small combinations
        if (b2_5 === 2) { b5 += 1; b2_5 = 0; }
        if ((b5 * 5 + b2_5 * 2.5) > 15) { b18 += 1; b5 = 0; b2_5 = 0; }

        const buckets = [];
        if (b18 > 0) buckets.push({ qty: b18, size: '18 kg' });
        if (b5 > 0) buckets.push({ qty: b5, size: '5 kg' });
        if (b2_5 > 0) buckets.push({ qty: b2_5, size: '2.5 kg' });

        if (buckets.length === 0) return '';

        return `
            <div class="mt-4 grid gap-3">
                ${buckets.map(b => `
                    <div class="flex items-center justify-between bg-[#133c2f]/60 border border-[#1b5543] p-3 sm:p-4 rounded-xl shadow-sm">
                        <div class="flex items-center space-x-3 sm:space-x-4">

                            </div>
                        </div>
                        <div class="text-xl sm:text-2xl font-black text-[#4ade80] flex items-center pr-2">
                            <span class="text-emerald-600 font-medium text-lg mr-2">×</span> ${b.qty}
                        </div>
                    </div>
                `).join('')}
            </div>
        `;

    // Render Walls Inputs
    function renderWalls() {
        wallsContainer.innerHTML = '';
        state.walls.forEach(wall => {
            const wallDiv = document.createElement('div');
            wallDiv.className = 'flex space-x-3 items-end';
            wallDiv.innerHTML = `
                <div class="flex-1">
                    <label class="block text-xs text-slate-500 mb-1">Width (m)</label>
                    <input type="number" min="0" class="wall-input w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 transition-colors" data-id="${wall.id}" data-field="width" value="${wall.width}" placeholder="e.g. 5.5">
                </div>
                <div class="flex-1">
                    <label class="block text-xs text-slate-500 mb-1">Height (m)</label>
                    <input type="number" min="0" class="wall-input w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 transition-colors" data-id="${wall.id}" data-field="height" value="${wall.height}" placeholder="e.g. 2.4">
                </div>
                <button type="button" class="remove-wall-btn p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors mb-0.5" data-id="${wall.id}" ${state.walls.length === 1 ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''}>
                    ${trashIcon}
                </button>
            `;
            wallsContainer.appendChild(wallDiv);
        });

        document.querySelectorAll('.wall-input').forEach(input => {
            input.addEventListener('input', (e) => {
                const id = parseInt(e.target.getAttribute('data-id'));
                const field = e.target.getAttribute('data-field');
                const wall = state.walls.find(w => w.id === id);
                if (wall) {
                    wall[field] = e.target.value;
                    calculate();
                }
            });
        });

        document.querySelectorAll('.remove-wall-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (state.walls.length > 1) {
                    const id = parseInt(e.currentTarget.getAttribute('data-id'));
                    state.walls = state.walls.filter(w => w.id !== id);
                    renderWalls();
                    calculate();
                }
            });
        });
    }

    addWallBtn.addEventListener('click', () => {
        state.walls.push({ id: Date.now(), width: '', height: '' });
        renderWalls();
        calculate();
    });

    exclusionsInput.addEventListener('input', (e) => {
        state.exclusions = e.target.value;
        calculate();
    });
    
    labourRateInput.addEventListener('input', (e) => {
        state.labourRate = parseFloat(e.target.value) || 0;
        calculate();
    });
    
    productivityInput.addEventListener('input', (e) => {
        state.productivity = parseFloat(e.target.value) || 1;
        calculate();
    });

    optionButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
            const group = e.currentTarget.getAttribute('data-group');
            const value = e.currentTarget.getAttribute('data-value');
            state[group] = value;
            document.querySelectorAll(`.btn-option[data-group="${group}"]`).forEach(b => b.classList.remove('active'));
            e.currentTarget.classList.add('active');
            if (group === 'colourGroup') clearColour(false);
            calculate();
        });
    });

    function calculate() {
        let totalGrossArea = state.walls.reduce((sum, wall) => {
            const w = parseFloat(wall.width) || 0;
            const h = parseFloat(wall.height) || 0;
            return sum + (w * h);
        }, 0);

        const exclusionsArea = parseFloat(state.exclusions) || 0;
        let netArea = totalGrossArea - exclusionsArea;
        if (netArea < 0) netArea = 0;

        if (netArea === 0) {
            resultsEmpty.classList.remove('hidden');
            resultsPopulated.classList.add('hidden');
            comparisonContainer.classList.add('hidden');

                            <h4 class="text-white text-xl lg:text-2xl font-bold leading-tight">Elastomeric Membrane</h4>
                            <p class="text-slate-400 text-[10px] lg:text-xs uppercase tracking-widest font-bold mt-1.5">Premium Acrylic System</p>

                    <!-- Visual Layer Architecture - Acrylic -->
                    <div class="h-[150px] mb-5 rounded-xl border border-slate-700/60 bg-slate-800/40 p-4 flex flex-col justify-center relative overflow-hidden">
                        <h5 class="text-slate-500 text-[10px] uppercase tracking-widest font-bold mb-2.5 z-10 relative">Coating Architecture</h5>
                        <div class="flex-1 flex flex-col w-full z-10 shadow-lg border border-slate-900 rounded-b bg-slate-950 relative">

                                Acrylic Topcoat 2
                            </div>
                            <div class="flex-1 bg-sky-500 flex items-center justify-center text-[10px] sm:text-xs font-bold text-white border-b border-sky-600/50 shadow-[inset_0_-2px_6px_rgba(0,0,0,0.1)]">

                                Acrylic Primer
                            </div>
                            
                            <!-- Sharp distinct gap representing weak surface adhesion -->
                            <div class="h-2 w-full bg-transparent flex items-center justify-center relative overflow-hidden">
                                <div class="absolute inset-0 bg-slate-950/80"></div>
                            </div>

                            <div class="flex-[1.8] bg-stone-500 rounded flex items-center justify-center text-[10px] sm:text-xs font-bold text-stone-200 border-t border-slate-600 relative overflow-hidden">
                                ${acrylicCrackSVG}
                                <span class="z-10 drop-shadow-md">Substrate (Surface Adhesion)</span>
                            </div>
                        </div>
                    </div>

                    <!-- Horizontal List Stats (Rigid Heights) -->
                    <div class="flex flex-col relative z-10">
                        <div class="flex justify-between items-center h-[64px] border-b border-slate-700/50">
                            <span class="text-[10px] lg:text-xs text-slate-500 uppercase tracking-widest font-bold whitespace-nowrap pr-2">Total Coats</span>
                            <div class="text-right">
                                <span class="text-sm lg:text-base font-bold text-slate-200 block">3 Coats</span>
                                <span class="text-[10px] lg:text-[11px] text-slate-500 block mt-0.5">(Primer + 2 Topcoats)</span>
                            </div>
                        </div>
                        <div class="flex justify-between items-center h-[64px] border-b border-slate-700/50">
                            <span class="text-[10px] lg:text-xs text-slate-500 uppercase tracking-widest font-bold whitespace-nowrap pr-2">Total Volume</span>
                            <span class="text-sm lg:text-base font-bold text-slate-200 text-right">${fmt(data.acrylicLiters)} Litres</span>
                        </div>
                        <div class="flex justify-between items-center h-[64px] border-b border-slate-700/50">
                            <span class="text-[10px] lg:text-xs text-slate-500 uppercase tracking-widest font-bold whitespace-nowrap pr-2">Labour Time</span>
                            <span class="text-sm lg:text-base font-bold text-slate-200 text-right">${fmt(data.acrylicLabourDays)} Days</span>
                        </div>
                        <div class="flex justify-between items-center h-[64px] border-b border-slate-700/50">
                            <span class="text-[10px] lg:text-xs text-slate-500 uppercase tracking-widest font-bold whitespace-nowrap pr-2">Labour Cost</span>
                            <span class="text-sm lg:text-base font-bold text-slate-200 text-right">$${fmtC(data.acrylicLabourCost)}</span>
                        </div>
                        <div class="flex justify-between items-center h-[64px] border-b border-slate-700/50">
                            <span class="text-[10px] lg:text-xs text-slate-500 uppercase tracking-widest font-bold whitespace-nowrap pr-2">Crack Treatment</span>
                            <div class="text-right">
                                <span class="text-sm lg:text-base font-bold text-amber-500 block">Temporary Masking</span>
                                <span class="text-[10px] lg:text-[11px] text-amber-600/70 block mt-0.5">(Stretches over cracks)</span>
                            </div>
                        </div>
                        <div class="flex justify-between items-center h-[64px] border-b border-slate-700/50">
                            <span class="text-[10px] lg:text-xs text-slate-500 uppercase tracking-widest font-bold whitespace-nowrap pr-2">Warranty</span>
                            <span class="text-sm lg:text-base font-bold text-slate-200 text-right">7 to 15 Years</span>
                        </div>
                        <div class="flex justify-between items-center h-[64px] border-b border-slate-700/50">
                            <span class="text-[10px] lg:text-xs text-slate-500 uppercase tracking-widest font-bold whitespace-nowrap pr-2">Lifespan</span>
                            <span class="text-sm lg:text-base font-bold text-slate-200 text-right">10-15 Years</span>
                        </div>
                        <div class="flex justify-between items-center h-[64px] border-b border-slate-700/50">
                            <span class="text-[10px] lg:text-xs text-slate-500 uppercase tracking-widest font-bold whitespace-nowrap pr-2">100-Yr Cycle</span>
                            <span class="text-sm lg:text-base font-bold text-amber-500 text-right">6 to 10 Repaints</span>
                        </div>
                        <div class="flex justify-between items-center h-[64px] border-b border-slate-700/50">
                            <span class="text-[10px] lg:text-xs text-slate-500 uppercase tracking-widest font-bold whitespace-nowrap pr-2">Bond Type</span>
                            <div class="text-right">
                                <span class="text-sm lg:text-base font-bold text-slate-200 block">Mechanical</span>
                                <span class="text-[10px] lg:text-[11px] text-slate-500 block mt-0.5">(Heavy Film)</span>
                            </div>
                        </div>
                        <div class="flex justify-between items-center h-[64px] border-b border-slate-700/50">
                            <span class="text-[10px] lg:text-xs text-slate-500 uppercase tracking-widest font-bold whitespace-nowrap pr-2">Breathability</span>
                            <div class="text-right">
                                <span class="text-sm lg:text-base font-bold text-slate-200 block">Low</span>
                                <span class="text-[10px] lg:text-[11px] text-slate-500 block mt-0.5">(Traps moisture)</span>
                            </div>
                        </div>
                        <div class="flex justify-between items-center h-[64px] border-b border-slate-700/50">
                            <span class="text-[10px] lg:text-xs text-slate-500 uppercase tracking-widest font-bold whitespace-nowrap pr-2">UV Stability</span>
                            <span class="text-sm lg:text-base font-bold text-slate-200 text-right">Prone to fading</span>
                        </div>
                        <div class="flex justify-between items-center h-[64px]">
                            <span class="text-[10px] lg:text-xs text-slate-500 uppercase tracking-widest font-bold whitespace-nowrap pr-2">Composition</span>
                            <div class="text-right">
                                <span class="text-sm lg:text-base font-bold text-amber-500 block">Liquid Plastic</span>
                                <span class="text-[10px] lg:text-[11px] text-amber-600/70 block mt-0.5">(Microplastics & VOCs)</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex items-start space-x-3 text-xs sm:text-sm text-slate-500 bg-white p-5 rounded-xl border border-slate-200 mt-8 shadow-sm max-w-4xl mx-auto leading-relaxed">
                <div class="text-emerald-500 shrink-0 mt-0.5">${infoIcon}</div>
                <p>* KEIM Litre conversion is based on a specific density of 1.4 kg/L. Elastomeric comparison uses standard industry high-build spread rates (Primer @ 10m²/L, 2x Topcoats @ 4m²/L). Time estimation assumes a productivity rate of ${data.productivity}m² per day per coat, reflecting purely application time (excludes prep, dry times, and scaffold adjustments).</p>
            </div>
        `;

        comparisonContainer.innerHTML = htmlComparison;
    }

    // Initial render
    renderWalls();

    // ---- Colour picker: choosing a colour sets its price group automatically ----
    const colourSearch = document.getElementById('colour-search');
    const colourList = document.getElementById('colour-list');
    const colourSwatch = document.getElementById('colour-swatch');
    const colourClear = document.getElementById('colour-clear');
    const colourStatus = document.getElementById('colour-status');
    const DEFAULT_STATUS = 'Pick your colour and the price group is set for you.';
    const norm = (t) => String(t).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    const COLOUR_INDEX = KEIM_COLOURS.map(c => ({ name: c[0], hex: c[1], group: 'pg' + c[2], key: norm(c[0]) }));
    let colourMatches = [];
    let colourActive = -1;


    function setGroupButton(value) {
        state.colourGroup = value;
        document.querySelectorAll('.btn-option[data-group="colourGroup"]').forEach(b => {
            b.classList.toggle('active', b.getAttribute('data-value') === value);
        });
    }

    function findColours(q) {
        const tokens = norm(q).split(' ').filter(Boolean);
        if (!tokens.length) return COLOUR_INDEX.slice(0, 60);
        return COLOUR_INDEX.filter(c => tokens.every(t => c.key.split(' ').some(w => w.startsWith(t)) || c.key.includes(t))).slice(0, 60);
    }

    function renderColourList() {
        if (!colourMatches.length) {
            colourList.innerHTML = '<li class="px-4 py-3 text-sm text-slate-500">No KEIM colour matches. Try the number, e.g. 9049.</li>';
        } else {
            colourList.innerHTML = colourMatches.map((c, i) => `
                <li role="option" data-i="${i}" aria-selected="${i === colourActive}" class="colour-opt flex items-center gap-3 px-4 py-2 cursor-pointer text-sm ${i === colourActive ? 'bg-emerald-50' : 'hover:bg-slate-50'}">
                    <span class="shrink-0 w-5 h-5 rounded border border-black/10" style="background:${c.hex}"></span>
                    <span class="flex-1 min-w-0 truncate text-slate-800">${escapeHtml(c.name)}</span>
                    <span class="shrink-0 text-xs text-slate-500">${GROUP_SHORT[c.group]}</span>
                </li>`).join('');
        }
        colourList.classList.remove('hidden');
        colourSearch.setAttribute('aria-expanded', 'true');
        const act = colourList.querySelector('[aria-selected="true"]');
        if (act) act.scrollIntoView({ block: 'nearest' });
    }

    function closeColourList() {
        colourList.classList.add('hidden');
        colourSearch.setAttribute('aria-expanded', 'false');
        colourActive = -1;
    }

    function pickColour(c) {
        state.colourName = c.name;
        colourSearch.value = c.name;
        colourSwatch.style.background = c.hex;
        colourClear.classList.remove('hidden');
        setGroupButton(c.group);
        colourStatus.innerHTML = `<span class="text-emerald-700 font-medium">${escapeHtml(c.name)} is in price ${GROUP_SHORT[c.group].toLowerCase()}.</span> Price updated.`;
        closeColourList();
        colourSearch.blur();
        calculate();
    }

    function clearColour(resetGroup) {
        state.colourName = '';
        colourSearch.value = '';
        colourSwatch.style.background = '#FFFFFF';
        colourClear.classList.add('hidden');
        colourStatus.textContent = DEFAULT_STATUS;
        if (resetGroup) { setGroupButton('white'); calculate(); }
    }

    colourSearch.addEventListener('focus', () => { colourMatches = findColours(state.colourName ? '' : colourSearch.value); colourActive = -1; renderColourList(); if (state.colourName) colourSearch.select(); });
    colourSearch.addEventListener('click', () => { if (state.colourName && colourSearch.value === state.colourName) colourSearch.select(); if (colourList.classList.contains('hidden')) { colourMatches = findColours(''); renderColourList(); } });
    colourSearch.addEventListener('input', () => { colourMatches = findColours(colourSearch.value); colourActive = colourMatches.length ? 0 : -1; renderColourList(); });
    colourSearch.addEventListener('keydown', (e) => {
        if (colourList.classList.contains('hidden') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { colourMatches = findColours(colourSearch.value); renderColourList(); }
        if (e.key === 'ArrowDown') { e.preventDefault(); colourActive = Math.min(colourActive + 1, colourMatches.length - 1); renderColourList(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); colourActive = Math.max(colourActive - 1, 0); renderColourList(); }
        else if (e.key === 'Enter') { e.preventDefault(); if (colourMatches[colourActive]) pickColour(colourMatches[colourActive]); }
        else if (e.key === 'Escape') { closeColourList(); colourSearch.blur(); }
    });
    colourList.addEventListener('mousedown', (e) => {
        const li = e.target.closest('.colour-opt');
        if (!li) return;
        e.preventDefault();
        pickColour(colourMatches[+li.dataset.i]);
    });
    colourClear.addEventListener('click', () => clearColour(true));
    document.addEventListener('mousedown', (e) => {
        if (!document.getElementById('colour-picker').contains(e.target)) {
            closeColourList();
            if (state.colourName && colourSearch.value !== state.colourName) colourSearch.value = state.colourName;
            if (!state.colourName) colourSearch.value = '';
        }
    });
    colourSearch.addEventListener('blur', () => setTimeout(() => {
        if (document.activeElement === colourSearch) return;
        closeColourList();
        colourSearch.value = state.colourName || '';
    }, 150));

    // Deep link: ?colour=avantgarde-101 (or "Avantgarde 101") preselects that colour.
    (function preselectColour() {
        const q = new URLSearchParams(location.search).get('colour') || new URLSearchParams(location.search).get('color');
        if (!q) return;
        const k = norm(q);
        const hit = COLOUR_INDEX.find(c => c.key === k) || COLOUR_INDEX.find(c => c.key.startsWith(k + ' ')) || COLOUR_INDEX.find(c => c.key.startsWith(k));
        if (hit) pickColour(hit);
    })();

</script>
